<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Players</title>
    <link rel="stylesheet" href="styles.css">
    <script src="players.js" defer></script>
</head>
<body>
    <header class="topbar">
        <div class="topbar-brand">
            <div class="topbar-logo">Logo</div>
            <span class="topbar-site-name">Site Name</span>
        </div>
        <nav class="topbar-links">
            <a href="/players" class="topbar-link">Players</a>
            <a href="/teams" class="topbar-link">Teams</a>
            <a href="/maps" class="topbar-link">Maps</a>
            <a href="/compare" class="topbar-link">Compare</a>
            <a href="/" class="topbar-link">Home</a>
        </nav>
    </header>

    <main class="page-content">
        <section class="player-list-intro">
            <div>
                <h1>Players</h1>
                <p>Browse total and average stats for all players. Use column headers to sort, and page through 20 players at a time.</p>
            </div>
        </section>

        <section class="player-table-section">
            <div class="section-header">
                <h2>Total Stats</h2>
                <div class="section-meta" id="totalMeta"></div>
            </div>
            <div class="table-search">
                <label for="totalSearch">Search total stats</label>
                <input id="totalSearch" type="search" placeholder="Search players, roles, teams...">
            </div>
            <table class="stats-table" id="totalStatsTable">
                <thead>
                    <tr id="totalStatsHeader"></tr>
                </thead>
                <tbody id="totalStatsBody"></tbody>
            </table>
            <div class="pagination" id="totalPagination"></div>
        </section>

        <section class="player-table-section">
            <div class="section-header">
                <h2>Average Stats</h2>
                <div class="section-meta" id="avgMeta"></div>
            </div>
            <div class="table-search">
                <label for="avgSearch">Search average stats</label>
                <input id="avgSearch" type="search" placeholder="Search players, roles, teams...">
            </div>
            <table class="stats-table" id="avgStatsTable">
                <thead>
                    <tr id="avgStatsHeader"></tr>
                </thead>
                <tbody id="avgStatsBody"></tbody>
            </table>
            <div class="pagination" id="avgPagination"></div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-left">
                <div class="footer-logo">Logo</div>
                <div>Contact us: <a href="mailto:contact@example.com">contact@example.com</a></div>
            </div>
            <div class="footer-links">
                <a href="/help">Help</a>
                <a href="/about">About</a>
                <a href="/privacy">Privacy</a>
                <a href="/terms">Terms</a>
            </div>
        </div>
    </footer>
</body>
</html>
