<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="title">Team Profile</title>
    <link rel="icon" type="image/svg+xml" href="/content/favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <header class="topbar">
        <a href="/" class="topbar-brand topbar-home-link">
            <div class="topbar-logo">Logo</div>
            <span class="topbar-site-name">OWCS<span style="color: #00ff8c;">LAB</span></span>
        </a>
        <nav class="topbar-links">
            <a href="/players" class="topbar-link">Players</a>
            <a href="/teams" class="topbar-link">Teams</a>
            <a href="/maps" class="topbar-link">Maps</a>
            <a href="/compare" class="topbar-link">Compare</a>
        </nav>
    </header>
    <div class="container page-loading">
        <div class="loading-placeholder" role="status" aria-label="Loading"><span class="loading-spinner" aria-hidden="true"></span></div>
        <!-- Team Header Section -->
        <div class="profile-header">
            <div class="team-info">
                <div>
                    <div class="team-name-section">
                        <div class="team-name-row">
                            <img src="" alt="Team Logo" class="team-icon" id="teamLogo">
                            <h1 class="team-name" id="teamName">Team</h1>
                        </div>
                    </div>
                </div>

                <div class="roster-section">
                    <div class="roster-header">
                        <h2>Roster</h2>
                    </div>
                    <div id="rosterContent"></div>
                </div>
            </div>
        </div>

    <div class="tournaments-section">
        <div class="section-header">
            <h2>Recent Tournaments</h2>
        </div>
        <table class="tournaments-table" id="tournamentsTable">
            <thead>
                <tr>
                    <th width="10%" class="icon-column">Icon</th>
                    <th>Tournament</th>
                    <th>Start</th>
                    <th>End</th>
                    <th>Placement</th>
                </tr>
            </thead>
            <tbody id="tournamentsTableBody">
            </tbody>
        </table>
    </div>

    <!-- Recent Matches Section -->
    <section class="recent-section">
        <div class="match-section-header">
            <div>
                <h2>Recent Matches</h2>
            </div>
        </div>

        <div class="table-shell">
            <table class="matches-table">
                <thead>
                    <tr>
                        <th>Tournament</th>
                        <th>Date</th>
                        <th>Matchup</th>
                        <th>Score</th>
                        <th>Link</th>
                    </tr>
                </thead>
                <tbody id="recentMatchesBody">
                    <tr>
                        <td colspan="5" class="recent-table-empty">Loading recent matches...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

    <!-- Hero Bans -->
    <div class="ban-graph-section">
        <div class="graph-header">
            <h2>Hero Bans</h2>
            <div class="graph-header-actions">
                <button type="button" class="filter-toggle filter-toggle-secondary" data-filter-toggle aria-expanded="false">Filter</button>
                <div class="compare-view-toggle" role="group" aria-label="Ban results grouping">
                    <button type="button" class="compare-view-button is-active" data-ban-view="hero">Hero</button>
                    <button type="button" class="compare-view-button" data-ban-view="role">Role</button>
                </div>
                <select class="graph-collapse-toggle ban-sort-select" id="banSortSelect" aria-label="Ban results order">
                    <option value="" disabled selected hidden>Sort By</option>
                    <option value="name">Hero Name</option>
                    <option value="total">Total Bans</option>
                    <option value="for">Bans By</option>
                    <option value="against">Bans Against</option>
                    <option value="winrate">Win Rate</option>
                </select>
                <button type="button" class="graph-collapse-toggle" data-ban-collapse-toggle aria-expanded="true" aria-controls="banChart">Collapse</button>
            </div>
        </div>
        <div class="ban-results-chart" id="banChart"></div>
    </div>

    <!-- Map Stats -->
    <div class="map-graph-section">
        <div class="graph-header">
            <h2>Map Results</h2>
            <div class="graph-header-actions">
                <button type="button" class="filter-toggle filter-toggle-secondary" data-filter-toggle aria-expanded="false">Filter</button>
                <div class="compare-view-toggle" role="group" aria-label="Map results grouping">
                    <button type="button" class="compare-view-button is-active" data-map-view="map">Map</button>
                    <button type="button" class="compare-view-button" data-map-view="mode">Mode</button>
                </div>
                <select class="graph-collapse-toggle map-sort-select" id="mapSortSelect" aria-label="Map results order">
                    <option value="" disabled selected hidden>Sort By</option>
                    <option value="name">Map Name</option>
                    <option value="winrate">Win Rate</option>
                    <option value="pickrate">Pick Rate</option>
                    <option value="played">Played</option>
                </select>
                <button type="button" class="graph-collapse-toggle" data-map-collapse-toggle aria-expanded="true" aria-controls="mapChart">Collapse</button>
            </div>
        </div>
        <div class="map-results-chart" id="mapChart"></div>
    </div>
</div>
    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-left">
                <div class="footer-logo">Logo</div>
                <div>Discord: <a href="https://discord.com/users/1149620046147096627">Vern</a></div>
                <div>Support Me: <a href="https://ko-fi.com/owcslab">Ko-fi<img src=""></a></div>
            </div>
            <div class="footer-links">
                <a href="/api">Api</a>
                <a href="/about">About</a>
                <a href="/privacy">Privacy</a>
                <a href="/terms">Terms</a>
            </div>
        </div>
    </footer>
 </body>
</html>
