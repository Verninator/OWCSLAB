<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="title">Team Profile</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <header class="topbar">
        <div class="topbar-brand">
            <div class="topbar-logo">Logo</div>
            <span class="topbar-site-name">Site Name</span>
        </div>
        <nav class="topbar-links">
            <a href="/players" class="topbar-link">Players</a>
            <a href="/teams" class="topbar-link">Teams</a>
            <a href="/maps" class="topbar-link">Maps</a>
            <a href="/compare" class="topbar-link">Compare</a>
            <a href="/" class="topbar-link">Home</a>
        </nav>
    </header>
    <div class="container">
        <!-- Team Header Section -->
        <div class="profile-header">
            <div class="team-info">
                <div>
                    <div class="team-name-section">
                        <div class="team-name-row">
                            <img src="" alt="Team Logo" class="team-icon" id="teamLogo">
                            <h1 class="team-name" id="teamName">Team</h1>
                        </div>
                    </div>
                </div>

                <div class="roster-section">
                    <div class="roster-header">
                        <h2>Roster</h2>
                    </div>
                    <div id="rosterContent"></div>
                </div>
            </div>
        </div>

    <div class="tournaments-section">
        <div class="section-header">
            <h2>Recent Tournaments</h2>
        </div>
        <table class="tournaments-table" id="tournamentsTable">
            <thead>
                <tr>
                    <th width="10%" class="icon-column">Icon</th>
                    <th>Tournament</th>
                    <th>Start</th>
                    <th>End</th>
                    <th>Placement</th>
                </tr>
            </thead>
            <tbody id="tournamentsTableBody">
            </tbody>
        </table>
    </div>

    <!-- Recent Matches Section -->
    <div class="matches-section">
        <div class="matches-header">
            <h2>Recent Matches</h2>
        </div>
        <table class="matches-table" id="matchesTable">
            <thead>
                <tr>
                    <th colspan="2" width = 30%>Tournament</th>
                    <th>Date</th>
                    <th colspan="2">Opponent</th>
                    <th colspan="2">Score</th>
                </tr>
            </thead>
            <tbody id="matchesTableBody">
            </tbody>
            <tfoot id="matchesTableFoot">
            </tfoot>
        </table>
    </div>

    <!-- Hero Bans -->
    <div class="ban-graph-section">
        <div class="graph-header">
            <h2>Hero Bans</h2>
            <div class="compare-view-toggle" role="group" aria-label="Ban results grouping">
                <button type="button" class="compare-view-button is-active" data-ban-view="hero">Hero</button>
                <button type="button" class="compare-view-button" data-ban-view="role">Role</button>
            </div>
        </div>
        <div class="ban-results-chart" id="banChart"></div>
    </div>

    <!-- Map Stats -->
    <div class="map-graph-section">
        <div class="graph-header">
            <h2>Map Results</h2>
            <div class="compare-view-toggle" role="group" aria-label="Map results grouping">
                <button type="button" class="compare-view-button is-active" data-map-view="map">Map</button>
                <button type="button" class="compare-view-button" data-map-view="mode">Mode</button>
            </div>
        </div>
        <div class="map-results-chart" id="mapChart"></div>
    </div>
</div>
    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-left">
                <div class="footer-logo">Logo</div>
                <div>Contact: <a href="mailto:contact@example.com">contact@example.com</a></div>
            </div>
            <div class="footer-links">
                <a href="/help">Help</a>
                <a href="/about">About</a>
                <a href="/privacy">Privacy</a>
                <a href="/terms">Terms</a>
            </div>
        </div>
    </footer>
 </body>
</html>
